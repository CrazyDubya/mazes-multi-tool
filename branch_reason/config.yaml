ollama:
  api_url: "http://localhost:11434/api/generate"
  model_name: "gemma2:9b"  # Replace with your actual model name in Ollama
  timeout: 120  # seconds

execution:
  max_iterations: 10
  stop_term: "END_OF_PATH"
  output_dir: "run_outputs"

reasoning_branches:
  deductive_reasoning:
    prompt: |
      <Prompt>
          <Instruction>
              Use deductive reasoning to solve the following problem. 
              Provide each iteration's response within <Iteration></Iteration> tags.
              Include a <StopTerm>END_OF_PATH</StopTerm> tag when the reasoning is complete.
          </Instruction>
          <Problem>{problem}</Problem>
          {previous_iterations}
      </Prompt>
    output_format: "xml"

  inductive_reasoning:
